# Supabase CLI configuration for EchoWords Cloud.
project_id = "echowords"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "http://localhost:4173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enabled = true
# For a child's account the parent signs up; set to true in production if you want e-mail confirmation.
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "10MiB"

[functions.transcribe]
verify_jwt = true
