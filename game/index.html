<!doctype html>
<html lang="fa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0920">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="تله‌زار — یک بازی سکوبازی پر از تله با کنترل لمسی موبایل">
<title>تله‌زار</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#fdf7ff; --muted:#b9b0d9; --glass:rgba(22,16,52,.62); --line:rgba(255,255,255,.14);
  --mint:#6ff3c4; --gold:#ffd36e; --rose:#ff5d8a; --bg:#0b0920;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;overscroll-behavior:none;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  font-family:Vazirmatn,Tahoma,system-ui,sans-serif;color:var(--ink)}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.fa{direction:rtl}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:20;display:none}
#hud.on{display:block}
.hbtn{pointer-events:auto;position:absolute;top:calc(env(safe-area-inset-top) + 10px);width:46px;height:46px;border-radius:14px;
  background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.hbtn svg{width:22px;height:22px}
.hbtn:active{transform:scale(.92)}
#bPause{left:calc(env(safe-area-inset-left) + 12px)}
#bRestart{left:calc(env(safe-area-inset-left) + 66px)}
#lvlTag{position:absolute;top:calc(env(safe-area-inset-top) + 14px);left:50%;transform:translateX(-50%);
  padding:6px 16px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-weight:700;font-size:15px;
  white-space:nowrap;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#deaths{position:absolute;top:calc(env(safe-area-inset-top) + 10px);right:calc(env(safe-area-inset-right) + 12px);height:46px;
  padding:0 16px;border-radius:14px;background:var(--glass);border:1px solid var(--line);display:flex;align-items:center;gap:8px;
  font-weight:900;font-size:18px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#deaths svg{width:22px;height:22px}
#deaths.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.25)}}
#banner{position:absolute;top:max(30%,110px);left:50%;transform:translate(-50%,-50%);text-align:center;opacity:0;transition:opacity .4s}
#banner.show{opacity:1}
#banner small{display:block;font-size:15px;color:var(--mint);letter-spacing:2px;font-weight:700}
#banner b{display:block;font-size:clamp(28px,5vw,52px);font-weight:900;text-shadow:0 0 24px rgba(160,120,255,.7),0 4px 0 rgba(0,0,0,.4)}
#taunt{position:absolute;top:44%;left:50%;transform:translate(-50%,-50%) scale(.6);font-size:clamp(22px,3.6vw,38px);font-weight:900;
  color:var(--rose);text-shadow:0 0 20px rgba(255,60,120,.6),0 3px 0 rgba(0,0,0,.5);opacity:0;white-space:nowrap}
#taunt.show{animation:taunt 1.1s ease-out forwards}
@keyframes taunt{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}
  25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-62%) scale(1)}}

/* ---------- Touch controls ---------- */
#touch{position:fixed;inset:0;z-index:10;display:none}
#touch.on{display:block}
.tb{position:absolute;bottom:var(--bb,22px);border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.22),rgba(255,255,255,.06) 60%);border:2px solid rgba(255,255,255,.22);
  box-shadow:0 8px 26px rgba(0,0,0,.35),inset 0 0 20px rgba(255,255,255,.06);transition:transform .06s,background .06s,border-color .06s;
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);pointer-events:none}
.tb svg{width:44%;height:44%;opacity:.92}
.tb.p{transform:scale(.9);background:radial-gradient(circle at 35% 30%,rgba(111,243,196,.55),rgba(111,243,196,.15) 65%);border-color:rgba(111,243,196,.9);
  box-shadow:0 0 28px rgba(111,243,196,.55)}
#tL{left:calc(env(safe-area-inset-left) + 18px);width:var(--bs,92px);height:var(--bs,92px)}
#tR{left:calc(env(safe-area-inset-left) + 32px + var(--bs,92px));width:var(--bs,92px);height:var(--bs,92px)}
#tJ{right:calc(env(safe-area-inset-right) + 22px);width:var(--js,112px);height:var(--js,112px);bottom:var(--jb,22px)}
#tJ.p{background:radial-gradient(circle at 35% 30%,rgba(255,211,110,.6),rgba(255,211,110,.15) 65%);border-color:rgba(255,211,110,.95);box-shadow:0 0 30px rgba(255,211,110,.55)}

/* ---------- Menus ---------- */
.screen{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:16px;
  background:radial-gradient(ellipse at center,rgba(12,8,36,.35),rgba(6,4,20,.82))}
.screen.on{display:flex}
.panel{width:min(560px,100%);max-height:100%;overflow:auto;text-align:center;padding:26px 22px;border-radius:26px;background:var(--glass);
  border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 30px 80px rgba(0,0,0,.5)}
.logo{font-size:clamp(48px,11vw,92px);font-weight:900;line-height:1.05;margin:0;
  background:linear-gradient(180deg,#fff6d8 10%,#ffc56b 45%,#ff5d8a 95%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 22px rgba(255,140,90,.45)) drop-shadow(0 5px 0 rgba(40,10,40,.6))}
.sub{color:var(--muted);margin:6px 0 20px;font-size:15px}
.btns{display:flex;flex-direction:column;gap:10px;align-items:stretch;max-width:340px;margin:0 auto}
.btn{padding:14px 18px;border-radius:16px;font-size:18px;font-weight:700;background:rgba(255,255,255,.08);border:1px solid var(--line);transition:transform .08s,background .15s}
.btn:active{transform:scale(.96)}
.btn.primary{background:linear-gradient(180deg,#7ef7cf,#33c99b);color:#08261d;border:0;box-shadow:0 8px 26px rgba(70,230,170,.35);font-size:21px;font-weight:900}
.row{display:flex;gap:10px}
.row .btn{flex:1}
.keys{margin-top:16px;color:var(--muted);font-size:13px;line-height:1.8}
kbd{font-family:inherit;background:rgba(255,255,255,.12);border:1px solid var(--line);border-bottom-width:3px;border-radius:6px;padding:0 6px;font-size:12px}
h2{margin:0 0 14px;font-size:28px;font-weight:900}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}
.lv{aspect-ratio:1;border-radius:16px;font-size:22px;font-weight:900;background:rgba(255,255,255,.08);border:1px solid var(--line);display:grid;place-items:center;position:relative}
.lv.done{background:linear-gradient(180deg,rgba(111,243,196,.35),rgba(111,243,196,.1));border-color:rgba(111,243,196,.6)}
.lv:disabled{opacity:.3}
.lv:not(:disabled):active{transform:scale(.93)}
.stat{display:flex;justify-content:center;gap:12px;margin:8px 0 18px;flex-wrap:wrap}
.stat div{padding:10px 16px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid var(--line)}
.stat b{display:block;font-size:26px;font-weight:900;color:var(--gold)}
.stat span{font-size:13px;color:var(--muted)}
#rotate{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;flex-direction:column;gap:18px;text-align:center;
  padding:24px;background:rgba(8,6,24,.94)}
#rotate.on{display:flex}
#rotate svg{width:84px;height:84px;animation:rot 2.2s ease-in-out infinite}
@keyframes rot{0%,20%{transform:rotate(0)}55%,80%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
@media (max-height:430px){.panel{padding:16px 18px}.logo{font-size:54px}.sub{margin:2px 0 12px}.btn{padding:10px 16px}.keys{display:none}
  .grid{grid-template-columns:repeat(10,1fr)}.lv{font-size:17px;border-radius:12px}}
@media (max-height:430px) and (max-width:600px){.grid{grid-template-columns:repeat(5,1fr)}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="touch" aria-hidden="true">
  <div class="tb" id="tL"><svg viewBox="0 0 24 24" fill="#fff"><path d="M15.5 4.5 7 12l8.5 7.5z"/></svg></div>
  <div class="tb" id="tR"><svg viewBox="0 0 24 24" fill="#fff"><path d="M8.5 4.5 17 12l-8.5 7.5z"/></svg></div>
  <div class="tb" id="tJ"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 4 3.5 14h5v6h7v-6h5z"/></svg></div>
</div>

<div id="hud">
  <button class="hbtn" id="bPause" aria-label="توقف"><svg viewBox="0 0 24 24" fill="#fff"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg></button>
  <button class="hbtn" id="bRestart" aria-label="شروع دوباره"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v5h5"/></svg></button>
  <div id="lvlTag" class="fa"></div>
  <div id="deaths"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2C7 2 3.5 5.6 3.5 10.3c0 2.7 1.2 4.6 3 5.8V19a1 1 0 0 0 1 1h1.3v-2h1.4v2h3.6v-2h1.4v2h1.3a1 1 0 0 0 1-1v-2.9c1.8-1.2 3-3.1 3-5.8C20.5 5.6 17 2 12 2zM8.6 13.6a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm6.8 0a2 2 0 1 1 0-4 2 2 0 0 1 0 4z"/></svg><span id="dCount">۰</span></div>
  <div id="banner" class="fa"><small id="bSmall"></small><b id="bBig"></b></div>
  <div id="taunt" class="fa"></div>
</div>

<div class="screen on fa" id="sTitle">
  <div class="panel">
    <h1 class="logo">تله‌زار</h1>
    <p class="sub">به هیچ چیز اعتماد نکن… حتی به زمین زیر پات.</p>
    <div class="btns">
      <button class="btn primary" id="bPlay">▶ شروع بازی</button>
      <button class="btn" id="bLevels">انتخاب مرحله</button>
      <div class="row"><button class="btn" id="bSound">🔊 صدا: روشن</button><button class="btn" id="bFull">⛶ تمام‌صفحه</button></div>
    </div>
    <div class="keys">موبایل: دکمه‌های لمسی ◀ ▶ و پرش<br>کیبورد: <kbd>←</kbd> <kbd>→</kbd> یا <kbd>A</kbd> <kbd>D</kbd> — پرش: <kbd>Space</kbd> / <kbd>↑</kbd> — شروع دوباره: <kbd>R</kbd> — توقف: <kbd>Esc</kbd></div>
  </div>
</div>

<div class="screen fa" id="sLevels">
  <div class="panel">
    <h2>انتخاب مرحله</h2>
    <div class="grid" id="lvGrid"></div>
    <div class="btns"><button class="btn" id="bBack">بازگشت</button></div>
  </div>
</div>

<div class="screen fa" id="sPause">
  <div class="panel">
    <h2>توقف</h2>
    <div class="btns">
      <button class="btn primary" id="bResume">▶ ادامه</button>
      <button class="btn" id="bRestart2">↻ شروع دوباره مرحله</button>
      <button class="btn" id="bSound2">🔊 صدا: روشن</button>
      <button class="btn" id="bMenu">منوی اصلی</button>
    </div>
  </div>
</div>

<div class="screen fa" id="sEnd">
  <div class="panel">
    <h1 class="logo" style="font-size:clamp(40px,8vw,70px)">بردی!</h1>
    <p class="sub">از همه تله‌ها جون سالم به در بردی… یا شاید هم نه 😈</p>
    <div class="stat"><div><b id="eDeaths">۰</b><span>تعداد مرگ</span></div><div><b id="eTime">۰</b><span>زمان</span></div></div>
    <div class="btns"><button class="btn primary" id="bAgain">↻ دوباره از اول</button><button class="btn" id="bMenu2">منوی اصلی</button></div>
  </div>
</div>

<div id="rotate" class="fa">
  <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"><rect x="7" y="2.5" width="10" height="19" rx="2.2"/><path d="M11 18.5h2"/></svg>
  <div style="font-size:20px;font-weight:700">برای بهترین تجربه گوشی رو افقی کن</div>
  <button class="btn" id="bRotOk">باشه، همین‌طوری ادامه بده</button>
</div>

<script>
'use strict';
/* =====================================================================
   تله‌زار (Trapland) — original troll-platformer
   ===================================================================== */
const T = 40, W = 1280, H = 720, STEP = 1 / 120;
const PH = { g: 2300, maxFall: 1150, run: 300, accG: 3400, accA: 2300, fric: 3800, jump: 780, cut: 260, coyote: 0.09, buf: 0.12, spring: 1400 };
const PW = 24, PHT = 30;
const faNum = n => String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
const hit = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const circRect = (cx, cy, r, x, y, w, h) => { const nx = Math.max(x, Math.min(cx, x + w)), ny = Math.max(y, Math.min(cy, y + h)); const dx = cx - nx, dy = cy - ny; return dx * dx + dy * dy < r * r; };
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);

/* ============================ LEVELS ============================ */
const LEVELS = [
  { name: 'اولین قدم', spawn: [2, 14], build(L) {
      L.block(null, 0, 15, 14, 3);
      L.block('drop', 14, 15, 4, 3);
      L.block(null, 18, 15, 14, 3);
      L.door(29, 13);
      L.trig(12.6, 14, 0.8, 1, () => { L.fall('drop', 0.05); L.sfx('rumble'); }, { ground: true });
  }},
  { name: 'خارهای پنهان', spawn: [2, 14], build(L) {
      L.block(null, 0, 15, 32, 3);
      L.spikes(null, 9, 14, 2, 'up');
      L.spikes('h1', 14, 14, 2, 'up', { hidden: true });
      L.trig(9, 8, 2, 6, () => L.pop('h1'));
      L.spikes('h2', 22, 14, 2, 'up', { hidden: true });
      L.trig(20.7, 13.5, 0.5, 1.5, () => L.pop('h2'), { ground: true });
      L.door(29, 13);
  }},
  { name: 'در فراری', spawn: [2, 14], build(L) {
      L.block(null, 0, 15, 32, 3);
      L.block('st1', 8, 13, 2, 2);
      L.block('st2', 4, 11, 2, 0.6);
      L.block(null, 0, 9, 3, 0.6);
      L.door(27, 13);
      L.trig(23.5, 13, 1, 2, () => { L.move('door', 0, -6, 34); L.move('door', -26.2, 0, 34); L.sfx('whoosh'); L.say('اونجا نه، اینجا!'); }, { ground: true });
      L.trig(4, 10, 2, 1, () => L.fall('st1', 0.25), { ground: true });
  }},
  { name: 'سقف سنگین', spawn: [2, 14], build(L) {
      L.block(null, 0, 15, 13, 3);
      L.spikes(null, 13, 17, 4, 'up');
      L.block(null, 13, 18, 4, 1);
      L.block(null, 17, 15, 15, 3);
      L.block('crush', 13, 1, 4, 3, { fallV: 260 });
      L.spikes(null, 13, 4, 4, 'down', { parent: 'crush' });
      L.trig(12.4, 0, 4.8, 15, () => { L.fall('crush', 0.15); L.sfx('rumble'); });
      L.door(29, 13);
      L.trig(24, 13, 1, 2, () => { L.move('door', 0, 2.1, 9); L.move('door', 0, -2.1, 5, 0.8); L.say('قایم‌موشک!'); }, { ground: true });
  }},
  { name: 'پل لرزان', spawn: [1, 14], build(L) {
      L.block(null, 0, 15, 9, 3);
      L.spikes(null, 9, 17, 17, 'up');
      L.block('p1', 11, 14, 3, 0.5, { crumble: 0.5 });
      L.block('p2', 16, 14, 3, 0.5);
      L.block('p3', 21, 14, 3, 0.5, { crumble: 0.5 });
      L.block(null, 26, 15, 6, 3);
      L.saw('saw', 20, 19.5, 0.9);
      L.trig(16, 13, 3, 1, () => { L.move('saw', 0, -6, 15); L.move('saw', 0, 6, 6, 1.1); }, { ground: true });
      L.door(29, 13);
  }},
  { name: 'فنر قلابی', spawn: [2, 14], build(L) {
      L.block(null, 0, 15, 10, 3);
      L.block('tf', 10, 15, 3, 3, { fallV: 320 });
      L.spring('s1', 11, 14, { parent: 'tf' });
      L.block(null, 13, 15, 19, 3);
      L.spring('s2', 17, 14);
      L.block(null, 21, 6, 11, 1);
      L.door(28.5, 4);
      L.trig(9.3, 13, 0.7, 2, () => { L.fall('tf', 0); L.say('فنر؟ کدوم فنر؟'); }, { ground: true });
  }},
  { name: 'دیوار تعقیب', spawn: [3, 14], build(L) {
      L.block(null, 0, 15, 10, 3);
      L.spikes(null, 10, 17, 2, 'up');
      L.block(null, 12, 15, 6, 3);
      L.spikes(null, 15, 14, 1, 'up');
      L.block('cr', 18, 15, 4, 3, { crumble: 0.1 });
      L.block(null, 22, 15, 10, 3);
      L.block('wall', -7, 0, 6, 15);
      L.spikes(null, -1, 0, 15, 'right', { parent: 'wall' });
      L.trig(5, 12, 1, 3, () => { L.move('wall', 27, 0, 5.2, 0.35); L.sfx('rumble'); L.shake(6); L.say('فرار کن!'); });
      L.door(29, 13);
  }},
  { name: 'وارونه', spawn: [2, 14], build(L) {
      L.block(null, 0, 15, 10, 3);
      L.spikes(null, 10, 17, 22, 'up');
      L.block(null, 7, 0, 25, 3);
      L.orb('o1', 8.6, 14.4);
      L.spikes(null, 16, 3, 2, 'down');
      L.orb('trap', 18.6, 6.1);
      L.door(28.5, 3, { flip: true });
  }},
  { name: 'تاریکی', dark: true, spawn: [1, 14], build(L) {
      L.block(null, 0, 15, 7, 3);
      L.spikes(null, 7, 17, 19, 'up');
      L.block(null, 9, 14, 3, 4);
      L.block(null, 14, 13, 3, 5);
      L.saw('sw', 19, 11, 0.8, { patrol: [[19, 10.5], [19, 15.4]], speed: 3.2 });
      L.block(null, 21, 14, 4, 4);
      L.spikes('hs', 23, 13, 1, 'up', { hidden: true });
      L.trig(21, 13, 4, 1, () => L.pop('hs'), { ground: true });
      L.block(null, 26, 15, 6, 3);
      L.door(29, 13);
  }},
  { name: 'آخرین شوخی', spawn: [2, 14], build(L) {
      L.block(null, 0, 15, 32, 3);
      L.spikes('a', 10, 14, 2, 'up', { hidden: true });
      L.trig(8.4, 13.5, 0.6, 1.5, () => L.pop('a'), { ground: true });
      L.door(28, 13);
      L.block('mp', 12, 8.5, 5, 0.6, { hidden: true });
      L.block('st2', 18, 10.5, 2, 0.6, { hidden: true });
      L.block('st1', 21, 12.5, 2, 0.6, { hidden: true });
      L.spikes('ms', 13.6, 7.5, 2, 'up', { hidden: true });
      L.saw('sweep', -3, 14.1, 0.9);
      L.trig(24, 13, 1, 2, () => {
        L.move('door', 0, -6.5, 30); L.move('door', -15.9, 0, 30);
        L.pop('st1', 0.25); L.pop('st2', 0.4); L.pop('mp', 0.55); L.say('بیا بالا اگه جرئت داری');
      }, { ground: true });
      L.trig(18, 9.5, 2, 1, () => { L.move('sweep', 40, 0, 10); L.sfx('saw'); }, { ground: true });
      L.trig(15.6, 7.5, 1.4, 1, () => L.pop('ms'), { ground: true });
  }},
];

/* ============================ LEVEL RUNTIME ============================ */
class Level {
  constructor(def, world) {
    this.def = def; this.w = world; this.ents = []; this.byId = {}; this.trigs = []; this.timers = []; this.t = 0;
    def.build(this);
    for (const e of this.ents) if (e.parent) { const p = this.byId[e.parent]; e.par = p; e.offx = e.x - p.x; e.offy = e.y - p.y; }
  }
  add(id, e) { e.id = id; e.moves = []; e.dx = 0; e.dy = 0; e.shake = 0; this.ents.push(e); if (id) this.byId[id] = e; return e; }
  block(id, x, y, w, h, o = {}) { return this.add(id, Object.assign({ type: 'block', x: x * T, y: y * T, w: w * T, h: h * T, hidden: false, appear: 1 }, o, o.hidden ? { appear: 0 } : {})); }
  spikes(id, x, y, n, dir = 'up', o = {}) {

  }
  door(x, y, o = {}) { return this.add('door', Object.assign({ type: 'door', x: x * T, y: y * T, w: 1.4 * T, h: 2 * T }, o)); }
  saw(id, cx, cy, r, o = {}) {
    const e = this.add(id, Object.assign({ type: 'saw', x: cx * T, y: cy * T, r: r * T, rot: 0 }, o));
    if (o.patrol) e.patrol = { pts: o.patrol.map(p => [p[0] * T, p[1] * T]), sp: (o.speed || 3) * T, i: 1 };

  }

  e(id) { return typeof id === 'string' ? this.byId[id] : id; }
  move(id, dx, dy, speed, delay = 0) {

  shake(a) { this.w.shake(a); }
  sfx(n) { this.w.sfx(n); }
  say(t) { this.w.say(t); }
}

/* ============================ WORLD / PHYSICS ============================ */
class World {
  constructor(idx, opt = {}) {
    this.idx = idx; this.def = LEVELS[idx]; this.silent = !!opt.silent;
    this.parts = []; this.shakeA = 0; this.flash = 0; this.time = 0; this.lightning = 0; this.lightT = 3;
    this.respawn(true);
  }
  respawn(first) {
    this.lv = new Level(this.def, this);
    const [sx, sy] = this.def.spawn;
    this.p = { x: sx * T + (T - PW) / 2, y: (sy + 1) * T - PHT, w: PW, h: PHT, vx: 0, vy: 0, g: 1, face: 1, onGround: true, ground: null, coy: 0, buf: 0,
      jumpHeld: true, jumping: false, sx: 1, sy: 1, runPhase: 0, dustT: 0, winS: 1, rot: 0, blink: 2, landV: 0 };
    this.state = 'play';
    if (!first) { this.burst(this.p.x + PW / 2, this.p.y + PHT / 2, 18, { col: '#fff1c9', sp: 220, life: .45, add: true, size: 3, inward: true }); this.sfx('spawn'); }
  }
  sfx(n) { if (!this.silent) Sound.play(n); }
  shake(a) { if (!this.silent) this.shakeA = Math.max(this.shakeA, a); }
  say(t) { if (!this.silent && this.onSay) this.onSay(t); }
  isSolid(e) { return e.type === 'block' && !e.hidden && !e.gone; }
  solids() { return this.lv.ents.filter(e => this.isSolid(e)); }

  step(dt, inp) {
    this.time += dt;
    if (this.state === 'play') {
      const lv = this.lv; lv.t += dt;
      for (let i = lv.timers.length - 1; i >= 0; i--) { const tm = lv.timers[i]; tm.t -= dt; if (tm.t <= 0) { lv.timers.splice(i, 1); tm.fn(); } }
      this.updateEntities(dt);
      if (this.state === 'play') this.updatePlayer(dt, inp);
      if (this.state === 'play') this.checkTriggers();
      if (this.state === 'play') this.checkHazards(dt);
    } else if (this.state === 'dead') {
      this.updateEntities(dt, true);
      this.deadT -= dt; if (this.deadT <= 0) this.respawn(false);
    } else if (this.state === 'win') {
      this.updateEntities(dt, true);
      const p = this.p, d = this.winDoor; this.winT += dt;
      const tx = d.x + d.w / 2 - PW / 2, ty = d.y + d.h * 0.55 - PHT / 2;
      p.x = lerp(p.x, tx, Math.min(1, dt * 7)); p.y = lerp(p.y, ty, Math.min(1, dt * 7));
      p.winS = Math.max(0, 1 - this.winT * 1.6); p.rot += dt * 12;
      if (this.winT > 0.85 && !this.winFired) { this.winFired = true; if (this.onWin) this.onWin(); }
    }
    // particles
    for (let i = this.parts.length - 1; i >= 0; i--) {
      const q = this.parts[i]; q.life -= dt;
      if (q.life <= 0) { this.parts.splice(i, 1); continue; }
      q.vx *= (1 - q.drag * dt); q.vy = q.vy * (1 - q.drag * dt) + q.g * dt; q.x += q.vx * dt; q.y += q.vy * dt;
    }
    this.shakeA = Math.max(0, this.shakeA - dt * 40);
    this.flash = Math.max(0, this.flash - dt * 2.5);
    if (this.def.dark) { this.lightT -= dt; if (this.lightT <= 0) { this.lightning = 1; this.lightT = rand(2.6, 4.2); this.sfx('thunder'); } this.lightning = Math.max(0, this.lightning - dt * 3.2); }
  }

  updEnt(e, dt) {
    if (e.type === 'spike' && !e.hidden && e.pop < 1) e.pop = Math.min(1, e.pop + dt / 0.07);
    if (e.type === 'block' && !e.hidden && e.appear < 1) e.appear = Math.min(1, e.appear + dt / 0.25);
    if (e.type === 'saw') e.rot += dt * 14;
    if (e.type === 'spring' && e.anim > 0) e.anim = Math.max(0, e.anim - dt * 3);
    if (e.type === 'orb' && e.cd > 0) e.cd -= dt;
    if (e.par) return;
    if (e.falling) {
      if (e.fallDelay > 0) { e.fallDelay -= dt; e.shake = 1; return; }
      e.shake = 0; e.vy = Math.min(e.vy + PH.g * dt, 1500); e.y += e.vy * dt;
      if (e.type === 'block') {
        for (const s of this.lv.ents) {
          if (s !== e && this.isSolid(s) && !s.falling && hit(e, s)) {
            e.y = s.y - e.h; e.falling = false; e.vy = 0; e.landed = true;
            this.shake(10); this.sfx('thud');
            for (let k = 0; k < 22; k++) this.parts.push(this.mkPart(e.x + Math.random() * e.w, e.y + e.h, { col: '#8c7fb8', sp: 140, life: .7, size: rand(2, 5), g: 300, up: true }));
            break;
          }
        }
      }
      if (e.y > H + 500) e.gone = true;
      return;
    }
    if (e.moves.length) {
      const m = e.moves[0];
      if (m.delay > 0) m.delay -= dt;
      else {
        const dx = m.tx - e.x, dy = m.ty - e.y, d = Math.hypot(dx, dy), st = m.sp * dt;
        if (d <= st) { e.x = m.tx; e.y = m.ty; e.moves.shift(); } else { e.x += dx / d * st; e.y += dy / d * st; }
      }
    } else if (e.patrol) {
      const pt = e.patrol.pts[e.patrol.i], dx = pt[0] - e.x, dy = pt[1] - e.y, d = Math.hypot(dx, dy), st = e.patrol.sp * dt;
      if (d <= st) { e.x = pt[0]; e.y = pt[1]; e.patrol.i = (e.patrol.i + 1) % e.patrol.pts.length; } else { e.x += dx / d * st; e.y += dy / d * st; }
    }
  }

  updateEntities(dt, noPlayer) {
    const p = this.p, ents = this.lv.ents;
    for (const e of ents) { if (e.gone || e.par) continue; const ox = e.x, oy = e.y; this.updEnt(e, dt); e.dx = e.x - ox; e.dy = e.y - oy; }
    for (const e of ents) {
      if (!e.par || e.gone) continue;
      const ox = e.x, oy = e.y; this.updEnt(e, dt);
      e.x = e.par.x + e.offx; e.y = e.par.y + e.offy; e.dx = e.x - ox; e.dy = e.y - oy; e.shake = e.par.shake;
      if (e.par.gone) e.gone = true;
    }
    if (noPlayer) return;
    for (const e of ents) {
      if (!this.isSolid(e) || (!e.dx && !e.dy)) continue;
      if (p.ground === e && !e.falling) { p.x += e.dx; p.y += e.dy; continue; }
      if (hit(p, { x: e.x, y: e.y, w: e.w, h: e.h })) {
        if (Math.abs(e.dx) > Math.abs(e.dy)) p.x = e.dx > 0 ? e.x + e.w : e.x - PW;
        else if (e.dy > 0) { p.y = e.y + e.h; p.vy = Math.max(p.vy, e.dy / dt); }
        else { p.y = e.y - PHT; p.vy = Math.min(p.vy, 0); }
      }
    }
    const pr = { x: p.x + 1, y: p.y + 1, w: PW - 2, h: PHT - 2 };
    for (const e of ents) if (this.isSolid(e) && hit(pr, e)) { this.die('crush'); return; }
  }

  updatePlayer(dt, inp) {
    const p = this.p, g = p.g;
    const dir = (inp.right ? 1 : 0) - (inp.left ? 1 : 0);
    if (dir) {
      p.face = dir;
      let acc = p.onGround ? PH.accG : PH.accA;
      if (Math.sign(p.vx) !== dir && p.vx !== 0) acc *= 1.7;
      p.vx = clamp(p.vx + dir * acc * dt, -PH.run, PH.run);
    } else {
      const f = (p.onGround ? PH.fric : PH.fric * 0.45) * dt;
      p.vx = Math.abs(p.vx) <= f ? 0 : p.vx - Math.sign(p.vx) * f;
    }
    if (inp.jump && !p.jumpHeld) p.buf = PH.buf;
    p.jumpHeld = inp.jump;
    p.buf -= dt;
    p.coy = p.onGround ? PH.coyote : p.coy - dt;
    if (p.buf > 0 && p.coy > 0) {
      p.vy = -PH.jump * g; p.buf = 0; p.coy = 0; p.onGround = false; p.ground = null; p.jumping = true;
      p.sx = 0.72; p.sy = 1.3; this.sfx('jump');
      for (let k = 0; k < 7; k++) this.parts.push(this.mkPart(p.x + PW / 2, g > 0 ? p.y + PHT : p.y, { col: '#b8acdf', sp: 90, life: .35, size: rand(2, 4), g: 200 * g, up: g > 0 }));
    }
    if (!inp.jump && p.jumping && p.vy * g < -PH.cut) p.vy = -PH.cut * g;
    if (p.vy * g >= 0) p.jumping = false;
    p.vy += PH.g * g * dt;
    if (p.vy * g > PH.maxFall) p.vy = PH.maxFall * g;

    const sol = this.solids();
    // X
    p.x += p.vx * dt;
    for (const s of sol) if (hit(p, s)) { if (p.vx > 0) p.x = s.x - PW; else if (p.vx < 0) p.x = s.x + s.w; p.vx = 0; }
    if (p.x < 0) { p.x = 0; p.vx = 0; } if (p.x > W - PW) { p.x = W - PW; p.vx = 0; }
    // Y
    const was = p.onGround, vyBefore = p.vy;
    p.onGround = false; p.ground = null;
    p.y += p.vy * dt;
    for (const s of sol) if (hit(p, s)) {
      if (p.vy > 0) { p.y = s.y - PHT; if (g > 0) { p.onGround = true; p.ground = s; } }
      else if (p.vy < 0) { p.y = s.y + s.h; if (g < 0) { p.onGround = true; p.ground = s; } }
      p.vy = 0;
    }
    if (p.onGround && !was && Math.abs(vyBefore) > 260) {
      const k = clamp(Math.abs(vyBefore) / 900, 0.15, 0.5);
      p.sx = 1 + k; p.sy = 1 - k * 0.8; this.sfx('land');
      for (let i = 0; i < 9; i++) this.parts.push(this.mkPart(p.x + PW / 2 + rand(-10, 10), g > 0 ? p.y + PHT : p.y, { col: '#b8acdf', sp: 120, life: .4, size: rand(2, 4.5), g: 250 * g, up: g > 0, side: true }));
    }
    if (p.ground && p.ground.crumble && !p.ground.falling) { this.lv.fall(p.ground, p.ground.crumble); this.sfx('crack'); }
    // animation state
    p.sx = lerp(p.sx, 1, Math.min(1, dt * 12)); p.sy = lerp(p.sy, 1, Math.min(1, dt * 12));
    if (p.onGround && Math.abs(p.vx) > 40) {
      p.runPhase += dt * Math.abs(p.vx) * 0.055;
      p.dustT -= dt;
      if (p.dustT <= 0) { p.dustT = 0.09; this.parts.push(this.mkPart(p.x + PW / 2 - p.face * 8, g > 0 ? p.y + PHT : p.y, { col: '#9d92c8', sp: 40, life: .35, size: rand(1.5, 3.5), g: -40 * g })); }
    }
    p.blink -= dt; if (p.blink < -0.12) p.blink = rand(1.8, 4);
  }

  checkTriggers() {
    const p = this.p;
    for (const t of this.lv.trigs) {
      if (t.fired || (t.ground && !p.onGround)) continue;
      if (hit(p, t)) { t.fired = true; t.fn(this.lv, this); }
    }
  }

  spikeBox(e) {
    const m = 7;
    switch (e.dir) {
      case 'up': return { x: e.x + m, y: e.y + T * 0.36, w: e.w - m * 2, h: T * 0.64 };
      case 'down': return { x: e.x + m, y: e.y, w: e.w - m * 2, h: T * 0.64 };
      case 'right': return { x: e.x, y: e.y + m, w: T * 0.64, h: e.h - m * 2 };
      default: return { x: e.x + T * 0.36, y: e.y + m, w: T * 0.64, h: e.h - m * 2 };
    }
  }

  checkHazards(dt) {
    const p = this.p;
    for (const e of this.lv.ents) {
      if (e.gone || e.hidden) continue;
      if (e.type === 'spike') { if (e.pop > 0.6 && hit(p, this.spikeBox(e))) return this.die('spike'); }
      else if (e.type === 'saw') { if (circRect(e.x, e.y, e.r * 0.8, p.x, p.y, PW, PHT)) return this.die('saw'); }
      else if (e.type === 'door') {
        const inner = e.flip ? { x: e.x + 12, y: e.y, w: e.w - 24, h: e.h - 16 } : { x: e.x + 12, y: e.y + 16, w: e.w - 24, h: e.h - 16 };
        if (hit(p, inner)) return this.win(e);
      }
      else if (e.type === 'spring') {
        if (p.g > 0 && p.vy >= 0 && hit(p, { x: e.x + 5, y: e.y - 2, w: e.w - 10, h: e.h + 2 })) {
          p.vy = -PH.spring; p.onGround = false; p.ground = null; p.jumping = false; p.coy = 0; p.buf = 0;
          p.sx = 0.65; p.sy = 1.45; e.anim = 1; this.sfx('spring');
          for (let k = 0; k < 12; k++) this.parts.push(this.mkPart(e.x + T / 2, e.y, { col: '#ffd36e', sp: 200, life: .45, size: rand(2, 4), g: 400, up: true, add: true }));
        }
      }
      else if (e.type === 'orb') {
        if (e.cd <= 0 && circRect(e.x, e.y, e.r, p.x, p.y, PW, PHT)) {
          e.cd = 0.6; p.g *= -1; p.vy *= 0.25; p.onGround = false; p.ground = null; p.jumping = false; this.sfx('orb'); this.shake(4);
          this.burst(e.x, e.y, 22, { col: '#c59bff', sp: 260, life: .5, add: true, size: 3 });
        }
      }
    }
    if (p.y > H + 60 || p.y < -110) this.die('fall');
  }

  mkPart(x, y, o) {
    const a = o.up ? rand(-Math.PI * 0.95, -Math.PI * 0.05) : o.side ? (Math.random() < .5 ? rand(-0.4, 0) : rand(-Math.PI, -Math.PI + 0.4)) : rand(0, Math.PI * 2);
    const sp = (o.sp || 100) * rand(0.35, 1);
    const life = (o.life || .5) * rand(0.6, 1);
    return { x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * (o.up === false ? -1 : 1), life, max: life, size: o.size || 3, col: o.col || '#fff', g: o.g || 0, drag: o.drag ?? 2.5, add: !!o.add, sq: !!o.sq };
  }
  burst(x, y, n, o = {}) {
    for (let i = 0; i < n; i++) {
      const q = this.mkPart(x + (o.spreadX ? rand(-o.spreadX, o.spreadX) : 0), y, o);
      if (o.inward) { q.x += q.vx * 0.3; q.y += q.vy * 0.3; q.vx *= -1; q.vy *= -1; }
      this.parts.push(q);
    }
  }

  die(cause) {
    if (this.state !== 'play') return;
    const p = this.p; this.state = 'dead'; this.deadT = 0.95; this.flash = 1;
    const cx = p.x + PW / 2, cy = p.y + PHT / 2;
    this.burst(cx, cy, 26, { col: '#ffe9c4', sp: 420, life: .9, size: 4.5, g: 900, drag: 1.2, sq: true });
    this.burst(cx, cy, 14, { col: '#ff7a45', sp: 380, life: .8, size: 4, g: 900, drag: 1.2, sq: true });
    this.burst(cx, cy, 18, { col: '#ffb36b', sp: 520, life: .45, size: 2.5, add: true });
    this.parts.push({ x: cx, y: cy, vx: 0, vy: 0, life: .4, max: .4, size: 0, col: '#fff', g: 0, drag: 0, ring: true });
    this.shake(16); this.sfx('die');
    if (this.onDeath) this.onDeath(cause);
  }
  win(door) {
    if (this.state !== 'play') return;
    this.state = 'win'; this.winT = 0; this.winDoor = door; this.winFired = false;
    this.sfx('win'); this.burst(door.x + door.w / 2, door.y + door.h / 2, 40, { col: '#ffe08a', sp: 320, life: .9, add: true, size: 3 });
  }
}

/* ============================ SOUND (Web Audio synth) ============================ */
const Sound = {
  ctx: null, on: true,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      const c = this.ctx = new AC();
      this.master = c.createGain(); this.master.gain.value = this.on ? 0.7 : 0; this.master.connect(c.destination);
      this.comp = c.createDynamicsCompressor(); this.comp.connect(this.master);
      this.sfx = c.createGain(); this.sfx.gain.value = 0.9; this.sfx.connect(this.comp);
      this.mus = c.createGain(); this.mus.gain.value = 0.32; this.mus.connect(this.comp);
      this.dly = c.createDelay(1); this.dly.delayTime.value = 0.36; this.fb = c.createGain(); this.fb.gain.value = 0.38;
      this.dlyF = c.createBiquadFilter(); this.dlyF.type = 'lowpass'; this.dlyF.frequency.value = 2200;
      this.dly.connect(this.dlyF); this.dlyF.connect(this.fb); this.fb.connect(this.dly); this.dlyF.connect(this.mus);
      const len = c.sampleRate; const b = c.createBuffer(1, len, c.sampleRate); const d = b.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.nbuf = b; this.startMusic();
    } catch (e) { this.ctx = null; }
  },
  setOn(v) { this.on = v; if (this.master) this.master.gain.setTargetAtTime(v ? 0.7 : 0, this.ctx.currentTime, 0.05); },
  tone(f0, f1, dur, type = 'square', vol = 0.2, delay = 0, bus) {
    const c = this.ctx; if (!c) return; const t = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain(); o.type = type;
    o.frequency.setValueAtTime(f0, t); if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(bus || this.sfx); o.start(t); o.stop(t + dur + 0.05);
  },
  noise(dur, vol, freq, type = 'lowpass', delay = 0, f1) {
    const c = this.ctx; if (!c) return; const t = c.currentTime + delay;
    const s = c.createBufferSource(); s.buffer = this.nbuf; const f = c.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(freq, t);
    if (f1) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = c.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.sfx); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
  },
  play(n) {
    if (!this.ctx || !this.on) return;

function drawParticles(world) {

function drawMotes(t, dt) {

function render(world, t, dt) {

  const sh = world ? world.shakeA : 0;
  const sx = sh ? rand(-sh, sh) * .6 : 0, sy = sh ? rand(-sh, sh) * .6 : 0;
  worldTransform(sx, sy);
  drawMotes(t, dt);
  if (world) {
    const ents = world.lv.ents;
    for (const e of ents) if (!e.gone && e.type === 'saw') drawTrack(e);
    for (const e of ents) if (!e.gone && !e.hidden && e.type === 'saw') drawSaw(e, t);
    for (const e of ents) if (!e.gone && !e.hidden && e.type === 'spike') drawSpike(e);
    for (const e of ents) if (!e.gone && !e.hidden && e.type === 'block') drawBlock(e, t);
    for (const e of ents) if (!e.gone && e.type === 'spring') drawSpring(e);
    for (const e of ents) if (!e.gone && e.type === 'orb') drawOrb(e, t);
    for (const e of ents) if (!e.gone && e.type === 'door') drawDoor(e, t, world);

    drawParticles(world);

  if (world && world.lightning > 0) { ctx.fillStyle = `rgba(210,200,255,${world.lightning * .12})`; ctx.fillRect(0, 0, cw, ch); }

let last = performance.now(), acc = 0, clock = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now; clock += dt;
  if (trans) { trans.t += dt; if (trans.t >= trans.dur) { const cb = trans.cb; trans = null; if (cb) cb(); } }
  if (app.state === 'play') {
    acc += dt; const inp = readInput();
    let n = 0; while (acc >= STEP && n < 14) { app.world.step(STEP, inp); acc -= STEP; n++; }
    if (n >= 14) acc = 0;
  } else if (app.state === 'title' && app.world) {
    // gentle idle on title backdrop
    app.world.step(dt, { left: false, right: false, jump: false });
  } else acc = 0;
  render(app.world, clock, dt);
  requestAnimationFrame(frame);
}

window.TRAPLAND = {
  LEVELS,
  sim(idx, script) {
    const w = new World(idx, { silent: true }); let t = 0, won = false, died = null;
    w.onWin = () => { won = true; }; w.onDeath = c => { died = died || c; };
    for (const [dur, k] of script) {
      const inp = { left: k.includes('l'), right: k.includes('r'), jump: k.includes('j') };
      for (let s = 0; s < Math.round(dur / STEP); s++) { w.step(STEP, inp); t += STEP; if (died || w.state === 'win') break; }
      if (died || w.state === 'win') break;
    }
    for (let s = 0; s < 200 && w.state === 'win'; s++) w.step(STEP, { left: false, right: false, jump: false });
    return { won, died, t: +t.toFixed(2), x: Math.round(w.p.x), y: Math.round(w.p.y), state: w.state };
  },
  probe(idx, script) {
    const w = new World(idx, { silent: true }); const out = [];
    for (const [dur, k] of script) { const inp = { left: k.includes('l'), right: k.includes('r'), jump: k.includes('j') };
      for (let s = 0; s < Math.round(dur / STEP); s++) { w.step(STEP, inp); } out.push([Math.round(w.p.x), Math.round(w.p.y), w.state]); }
    return out;
  }
};
</script>
