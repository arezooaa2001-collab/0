<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>لادینو | برنامه تدوین رایگان</title>
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <main class="app" aria-label="برنامه تدوین ویدیو لادینو">
      <header class="topbar">
        <div>
          <strong class="brand">لادینو</strong>
          <span class="status-pill">همه قابلیت‌ها رایگان</span>
        </div>
        <button class="icon-button" id="exportBtn">خروجی بدون واترمارک</button>
      </header>

      <section class="workspace">
        <aside class="tool-panel" aria-label="ابزارهای تدوین">
          <button class="tool-button is-active" data-tool="cut">✂<span>برش</span></button>
          <button class="tool-button" data-tool="crop">▣<span>کراپ</span></button>
          <button class="tool-button" data-tool="speed">⏩<span>سرعت</span></button>
          <button class="tool-button" data-tool="music">♫<span>موسیقی</span></button>
          <button class="tool-button" data-tool="caption">字幕<span>زیرنویس</span></button>
          <button class="tool-button" data-tool="sticker">★<span>استیکر</span></button>
          <button class="tool-button" data-tool="filter">◎<span>فیلتر</span></button>
          <button class="tool-button" data-tool="transition">⇄<span>ترنزیشن</span></button>
        </aside>

        <section class="preview-stage" aria-label="پیش‌نمایش ویدیو">
          <div class="phone-frame">
            <div class="video-preview" id="videoPreview">
              <video id="videoPlayer" controls playsinline hidden></video>
              <div class="empty-state" id="emptyState">
                <span>＋</span>
                <strong>ویدیو را وارد کن</strong>
                <small>MP4، MOV یا فایل نمایشی</small>
              </div>
              <p class="live-caption" id="liveCaption">لادینو؛ تدوین رایگان بدون قفل پریمیوم</p>
              <span class="free-watermark">FREE</span>
            </div>
          </div>
          <label class="upload-card" for="videoInput">
            <input id="videoInput" type="file" accept="video/*" />
            <span>انتخاب ویدیو</span>
            <small id="fileName">هنوز فایلی انتخاب نشده</small>
          </label>
        </section>

        <aside class="inspector" aria-label="تنظیمات ابزار انتخاب‌شده">
          <p class="eyebrow">پنل ابزار</p>
          <h1 id="toolTitle">برش رایگان</h1>
          <p id="toolDescription">قسمت‌های اضافه را حذف کن و کلیپ را برای ریلز یا شورتز آماده کن.</p>

          <div class="control-card">
            <label for="captionInput">متن زیرنویس</label>
            <textarea id="captionInput" rows="4">لادینو؛ تدوین رایگان بدون قفل پریمیوم</textarea>
          </div>

          <div class="control-grid">
            <label>نسبت تصویر
              <select id="ratioSelect">
                <option value="ratio-916">۹:۱۶ استوری</option>
                <option value="ratio-11">۱:۱ پست</option>
                <option value="ratio-169">۱۶:۹ یوتیوب</option>
              </select>
            </label>
            <label>استایل
              <select id="styleSelect">
                <option value="style-neon">نئون</option>
                <option value="style-cinema">سینمایی</option>
                <option value="style-clean">تمیز</option>
              </select>
            </label>
            <label>فیلتر
              <select id="filterSelect">
                <option value="filter-pop">Pop</option>
                <option value="filter-warm">Warm</option>
                <option value="filter-bw">B&W</option>
              </select>
            </label>
          </div>

          <div class="free-list" id="freeList"></div>
        </aside>
      </section>

      <section class="timeline" aria-label="تایم‌لاین تدوین">
        <div class="timeline-head">
          <strong>Timeline</strong>
          <span id="timelineStatus">پروژه رایگان آماده است</span>
        </div>
        <div class="tracks">
          <div class="track"><b>ویدیو</b><span class="clip clip--video">کلیپ اصلی</span><span class="clip clip--cut">برش</span></div>
          <div class="track"><b>صدا</b><span class="clip clip--audio">موسیقی رایگان</span></div>
          <div class="track"><b>متن</b><span class="clip clip--text" id="captionTrack">زیرنویس خودکار</span></div>
        </div>
      </section>
    </main>
    <script src="src/main.js"></script>
  </body>
</html>
