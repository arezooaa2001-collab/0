plugins {
    id 'com.android.application'
}

android {
    namespace 'com.amirabc.official'
    compileSdk 34

    defaultConfig {
        applicationId 'com.amirabc.official'
        minSdk 26          // Android 8.0
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
