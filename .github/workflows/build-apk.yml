# ساخت فایل APK اندروید و HTML تکی بازی «قهرمان پیست»
# فقط با دکمه «Run workflow» در تب Actions اجرا می‌شود.
name: Build Ghahreman Pist APK

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: racing-game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install build dependencies
        run: npm ci
      - name: Build single-file HTML
        run: npm run build:html
      - name: Build and sign APK
        run: bash android/build-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ghahreman-pist
          path: |
            racing-game/dist/ghahreman-pist.apk
            racing-game/dist/ghahreman-pist.html
